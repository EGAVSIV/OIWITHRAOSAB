name: OI Decay Calculation Engine

on:
  schedule:
    - cron: '*/5 3-9 * * 1-5'
  workflow_dispatch:

# Add this concurrency block to prevent overlapping deployments:
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Calculation Engine
        env:
          UPSTOX_TOKEN: ${{ secrets.UPSTOX_TOKEN }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          python engine/calculationengine.py

      - name: Commit and Push Generated JSON Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git status
          git diff-index --quiet HEAD || git commit -m "chore: auto-update market JSON data [skip ci]"
          git push
